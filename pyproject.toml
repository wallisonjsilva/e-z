[project]
name = "true-screen"
version = "0.1.0"
description = "Aplicativo desktop offline para captura e ampliação de evidências"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = ["PySide6==6.12.0"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pyinstaller==6.22.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
true-screen = "true_screen:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
